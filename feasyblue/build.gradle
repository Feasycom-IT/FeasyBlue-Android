apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'




android {

    compileSdkVersion 36

    defaultConfig {
        applicationId "com.feasycom.feasyblue"
        minSdkVersion 29
        targetSdkVersion 36
        versionCode 3601
        versionName "3.6.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        ndk {
            abiFilters 'arm64-v8a','armeabi-v7a' // 设置支持的so库架构 'armeabi-v7a'
            moduleName "FeasyBlueLibrary"
        }
    }



    buildTypes {

        release {


            // 禁用代码混淆（R8/ProGuard）
            minifyEnabled false
            zipAlignEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }



        debug {


            // 禁用代码混淆（R8/ProGuard）
            minifyEnabled false
            zipAlignEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

    }
    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['**/*.so']
        }
        resources {
            excludes += ['META-INF/ota_release.kotlin_module', 'META-INF/common_release.kotlin_module']
        }
    }



    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding = true // 启用ViewBinding
    }
    namespace 'com.feasycom.feasyblue'
    lint {
        abortOnError false
        checkReleaseBuilds false
    }


    applicationVariants.all { variant ->
        variant.outputs.all {
            if (buildType.name == 'release') {
                def createTime = new Date().format("YYYY-MM-dd", TimeZone.getTimeZone("GMT+08:00"))
                outputFileName = "FeasyBlue${defaultConfig.versionName}_${createTime}.apk"
            }
        }
    }


}

dependencies {

    def coroutines_version = "1.4.2"
    def room_version = "2.2.6"
    def retrofit_version = "2.9.0"
    def work_version = "2.7.1"
    def glide_version = "4.11.0"
    def lifecycle_version = "2.3.1"

    // SDK 以本地 AAR 的形式引入（AAR 内已包含 arm64-v8a / armeabi-v7a 的 .so）
    implementation files('libs/FeasyBlueLibrary-3.6.0.0.aar')
    // AndroidX 和 Material Design 依赖
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.legacy:legacy-support-core-ui:1.0.0'

    // 权限管理库
    implementation 'com.github.getActivity:XXPermissions:28.0'
    implementation 'com.github.getActivity:DeviceCompat:2.3'

    // 智能刷新布局
    implementation 'com.scwang.smartrefresh:SmartRefreshLayout:1.1.0'

    // 仿ios 开关
    implementation 'com.github.iielse:switchbutton:1.0.4'

    // 滑块
    implementation 'com.github.Jay-Goo:RangeSeekBar:v3.0.0'

    //图片加载库
    implementation "com.github.bumptech.glide:glide:$glide_version"

    // 测试和自动化工具
    implementation 'androidx.test.uiautomator:uiautomator:2.2.0'

    // Jetpack Lifecycle 组件

    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"

    // Jetpack WorkManager 组件
//    implementation "androidx.work:work-runtime-ktx:$work_version"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // MultiDex 支持
    implementation 'androidx.multidex:multidex:2.0.0'

    // 轻量级数据库
    implementation 'org.litepal.guolindev:core:3.2.3'

    // 网络请求库
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.1'
    implementation 'com.jakewharton.retrofit:retrofit2-kotlin-coroutines-adapter:0.9.2'

    // 字符集检测
    implementation 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'


    // 日志调试框架：https://github.com/getActivity/Logcat
    // debugImplementation 'com.github.getActivity:Logcat:10.6'

    // 悬浮窗框架：https://github.com/getActivity/XToast
    implementation 'com.github.getActivity:XToast:8.5'

    // 单元测试
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    // Kotlin 扩展库
    implementation "androidx.core:core-ktx:1.3.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    // 协程支持
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"

    // GSON 数据解析
    implementation "com.google.code.gson:gson:2.8.6"

    // 数字进度条
    implementation 'com.daimajia.numberprogressbar:library:1.4@aar'

    // 数据转换库
    implementation 'com.swallowsonny:convert-ext:1.0.4'

    // Bugly 奔溃报告
    implementation 'com.tencent.bugly:crashreport:latest.release'


    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    implementation 'io.netty:netty-all:5.0.0.Alpha2'
    implementation 'com.blankj:utilcodex:1.31.1'
}




